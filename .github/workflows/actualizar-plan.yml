name: Actualizar datos públicos del plan

on:
  repository_dispatch:
    types: [actualizar-plan]

permissions:
  contents: write

concurrency:
  group: actualizar-plan-publico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recibir datos del Excel
        env:
          SYNC_ID: ${{ github.event.client_payload.sync_id }}
          CHUNK_INDEX: ${{ github.event.client_payload.index }}
          CHUNK_TOTAL: ${{ github.event.client_payload.total }}
          CHUNK_DATA: ${{ github.event.client_payload.chunk }}
        run: node scripts/receive-sync.mjs

      - name: Publicar cambios
        run: |
          git config user.name "PMCA Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar datos públicos del plan"
          git push
